<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003366">
<meta name="robots" content="noindex,nofollow">
<title>KBA-015 Eigene Rolle im Betrieb · Waybuild Akademie</title>
<link rel="icon" href="assets/logo.png">
<style>
@font-face{font-family:Inter;src:url(assets/inter-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(assets/inter-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(assets/inter-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url(assets/inter-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Inter;src:url(assets/inter-800.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(assets/vazir-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(assets/vazir-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(assets/vazir-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --blue:#0077A6;--navy:#003366;--ink:#14212e;--muted:#5b6b7a;--line:#e3e9ef;--bg:#f4f7fa;--card:#fff;
  --t1:#0077A6;--t2:#1d8a6b;--t3:#d0731c;--t4:#c0394f;--extra:#7048b0;--extra-bg:#f4effb;
  --r:18px;--shadow:0 1px 2px rgba(16,40,64,.06),0 6px 20px rgba(16,40,64,.06);--shadow-h:0 2px 4px rgba(16,40,64,.08),0 14px 34px rgba(16,40,64,.13)
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
a{color:inherit;text-decoration:none}
button{font:inherit}
svg{display:block}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* App-Leiste */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px;padding-top:max(10px,env(safe-area-inset-top))}
.bar img{height:34px}
.bar .back{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--navy);padding:8px 12px 8px 8px;border-radius:12px;margin-left:-8px}
.bar .back:hover{background:var(--bg)}
.bar .kurs{font-weight:700;font-size:14px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .kurs small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.bar .sp{flex:1}
.iconbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.iconbtn:hover{color:var(--navy);border-color:#c9d5e0}
.iconbtn .ico{width:18px;height:18px}

.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 60px}

/* Kopfbereich */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:28px 30px;color:#fff;background:linear-gradient(120deg,var(--navy) 0%,#00507e 55%,var(--blue) 100%);box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;right:-80px;top:-90px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero:before{content:"";position:absolute;right:90px;bottom:-130px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero h1{font-size:30px;line-height:1.15;font-weight:800;margin:8px 0 10px;max-width:760px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.14)}
.chip .ico{width:15px;height:15px}
.progress{margin-top:20px;position:relative;z-index:1;max-width:520px}
.progress .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;opacity:.9;margin-bottom:7px}
.progress .track{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.progress .fill{height:100%;border-radius:99px;background:#fff}

/* Heute */
.today{display:flex;align-items:center;gap:18px;margin-top:18px;padding:18px 20px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);border:2px solid var(--blue);transition:transform .15s,box-shadow .15s}
.today:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.today .big{flex:none;width:58px;height:58px;border-radius:16px;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;line-height:1}
.today .big small{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85;margin-bottom:3px}
.today .txt{flex:1;min-width:0}
.today .k{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.today .h{font-size:18px;font-weight:700;color:var(--navy);margin-top:2px}
.today .go{flex:none;display:flex;align-items:center;gap:6px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;padding:11px 16px;border-radius:12px}
.today .go .ico{width:18px;height:18px}

/* Abschnitte */
.sec{margin-top:30px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-h .dot{width:10px;height:10px;border-radius:50%}
.sec-h h2{margin:0;font-size:17px;font-weight:700;color:var(--navy)}
.sec-h .cnt{font-size:13px;color:var(--muted);font-weight:500}

/* Tageskarten */
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.dayc{--c:var(--t1);display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
.dayc:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:transparent}
.dayc .num{flex:none;width:52px;height:52px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px;line-height:1}
.dayc .num small{font-size:9px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;margin-bottom:3px;opacity:.8}
.dayc .txt{flex:1;min-width:0}
.dayc .d{font-size:12.5px;color:var(--muted);font-weight:500}
.dayc .t{font-size:15.5px;font-weight:700;color:var(--ink);margin-top:2px;line-height:1.3}
.dayc .chev{flex:none;color:#a7b4c1}
.dayc.is-today{border:2px solid var(--blue);padding:13px 15px}
.dayc.is-done .num{background:#eef2f5;color:#8a99a8}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.now{background:var(--blue);color:#fff}
.tag.done{background:#e7f4ee;color:#1d8a6b}

/* Kacheln */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{--c:var(--blue);display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;min-height:150px;position:relative}
a.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:transparent}
.tile .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.tile .t{font-size:16.5px;font-weight:700;color:var(--ink)}
.tile .s{font-size:13.5px;color:var(--muted);margin-top:2px}
.tile .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--c)}
.tile .foot .ico{width:18px;height:18px}
.tile.primary{background:linear-gradient(135deg,var(--blue),#00598a);border:none;color:#fff}
.tile.primary .ic{background:rgba(255,255,255,.18);color:#fff}
.tile.primary .t,.tile.primary .s,.tile.primary .foot{color:#fff}
.tile.primary .s{opacity:.85}
.tile.soon{background:#fafbfc;border-style:dashed;box-shadow:none}
.tile.soon .ic{background:#eef2f5;color:#8a99a8}
.tile.soon .t{color:#6b7b8a}
.tile.soon .foot{display:none}
.pill{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2f5;color:#6b7b8a}
.pill.f{background:var(--extra-bg);color:var(--extra)}

/* Zusatz-Banner */
.extra{display:flex;align-items:center;gap:18px;padding:20px;border-radius:var(--r);background:var(--extra-bg);border:2px dashed #c6b3e6;transition:transform .15s,box-shadow .15s}
.extra:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.extra .ic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--extra);color:#fff;display:flex;align-items:center;justify-content:center}
.extra .txt{flex:1}
.extra .t{font-size:17px;font-weight:700;color:#4b2c84}
.extra .t span{font-weight:600;color:var(--extra)}
.extra .s{font-size:13.5px;color:#6a5a86;margin-top:2px}
.extra .go{flex:none;color:var(--extra)}

/* Tageskopf */
.dhero{--c:var(--t1);background:var(--card);border-radius:24px;padding:24px 26px;box-shadow:var(--shadow);border-top:6px solid var(--c)}
.dhero .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dhero .teil{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.dhero .date{font-size:13px;color:var(--muted);font-weight:600}
.dhero h1{font-size:28px;line-height:1.2;font-weight:800;color:var(--navy);margin:10px 0 6px}
.dhero .lk{font-size:13.5px;color:var(--muted)}
.dhero .merk{margin-top:16px;padding:12px 14px;border-radius:12px;background:#fff8e6;border-left:4px solid #e6a700;font-size:14px;color:#5c4a12}
.dhero .merk b{color:#8a6500}
.dhero.extra-h{--c:var(--extra)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.pager a{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:600;color:var(--navy);font-size:14px;box-shadow:var(--shadow)}
.pager a:hover{border-color:#c9d5e0}
.pager .ico{width:18px;height:18px}

.media{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.media video,.media iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.media audio{width:100%}
video::cue{font-family:Inter,system-ui,sans-serif;font-size:1.05em;line-height:1.35;background:rgba(0,0,0,.72);color:#fff}
.note{font-size:13.5px;color:var(--muted)}

footer{max-width:1120px;margin:0 auto;padding:0 20px 34px;font-size:12px;color:var(--muted);text-align:center}
footer a{color:var(--blue)}

/* Zugang */
#gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 10%,#0a6f9e 0,transparent 45%),linear-gradient(140deg,#002a52,#003a6b 50%,#0077A6)}
#gate .box{background:#fff;border-radius:24px;padding:30px 26px 26px;max-width:400px;width:100%;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#gate img{height:60px;margin:0 auto 14px}
#gate h1{font-size:20px;color:var(--navy);margin:0 0 4px;font-weight:800}
#gate .sub{font-size:13.5px;color:var(--muted);margin:0 0 20px}
#gate label{display:block;text-align:left;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px}
#gate input{width:100%;font:600 20px Inter,system-ui,sans-serif;padding:14px;border:2px solid var(--line);border-radius:14px;text-align:center;letter-spacing:4px;text-transform:uppercase;color:var(--navy)}
#gate input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,119,166,.12)}
#gate button{margin-top:14px;width:100%;font-size:16px;font-weight:700;padding:14px;border:0;border-radius:14px;background:var(--blue);color:#fff;cursor:pointer}
#gate button:hover{background:#00668f}
#gate .err{color:#b3261e;font-size:13px;min-height:18px;margin-top:10px}
#gate .shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#gate .fine{margin-top:16px;font-size:11.5px;color:#8a99a8}

.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}



/* Glossar */
.gtools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:9px 16px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.seg button .fa{font-family:Vazirmatn,Tahoma,sans-serif}
.gsearch{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.gsearch input{flex:1;border:0;outline:0;font:500 15px Inter,system-ui,sans-serif;padding:12px 0;background:none;color:var(--ink)}
.gsearch .ico{width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin-top:12px;scrollbar-width:thin}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.gcount{font-size:13px;color:var(--muted);margin:8px 2px 10px}
.glist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.gcard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.gcard .de{font-size:16.5px;font-weight:700;color:var(--navy)}
.gcard .tg{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#e6f2f8;color:var(--blue);cursor:pointer}
.gcard .tr{font-size:15.5px;font-weight:700;color:var(--blue);margin-top:4px}
.gcard .ex{font-size:14.5px;line-height:1.6;margin-top:6px;color:#26333f}
.gcard [dir=rtl]{font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;text-align:right;line-height:1.9}
.gcard [dir=rtl].ex{font-size:15.5px}
.gcard details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.gcard summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.gcard details p{margin:6px 0 0;font-size:14px;color:#3b4a58}
.empty{background:#fff;border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
@media (max-width:640px){.glist{grid-template-columns:1fr}.seg{width:100%}.seg button{flex:1;padding:9px 6px}.gsearch{min-width:0;width:100%}}


.tile.sk .langs{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.tile.sk .langs a{flex:1;text-align:center;font-size:13px;font-weight:700;padding:9px 8px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--c) 35%,#fff);color:var(--c);background:#fff;transition:background .15s,color .15s,transform .15s}
.tile.sk .langs a.fa{font-family:Vazirmatn,Tahoma,sans-serif}
.tile.sk .langs a:first-child{background:var(--c);color:#fff;border-color:var(--c)}
@media (hover:hover){.tile.sk .langs a:hover{background:var(--c);color:#fff;transform:translateY(-1px)}}
@media (max-width:640px){.tile.sk{flex-wrap:wrap}.tile.sk .langs{flex:1 1 100%;margin-top:4px}}


/* Seitenleiste Desktop */
#side{display:none}
@media (min-width:1080px){
  #side{display:block;position:fixed;top:57px;left:0;bottom:0;width:272px;overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:16px 12px 30px;z-index:10;scrollbar-width:thin}
  #app .wrap,#app footer{margin-left:272px}
  .wrap{max-width:1180px}
  .bar-in{max-width:none;padding-left:22px;padding-right:22px}
}
#side .grp{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8a99a8;margin:18px 10px 6px}
#side .grp:first-child{margin-top:4px}
#side a.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;color:#2b3a48;font-size:14px;font-weight:600;transition:background .15s,color .15s}
#side a.nv .ico{width:18px;height:18px;flex:none;color:#8a99a8}
#side a.nv:hover{background:var(--bg);color:var(--navy)}
#side a.nv:hover .ico{color:var(--blue)}
#side a.nv.on{background:#e8f3f9;color:var(--navy)}
#side a.nv.on .ico{color:var(--blue)}
#side a.dy{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:11px;font-size:13.5px;color:#2b3a48;font-weight:600;transition:background .15s}
#side a.dy:hover{background:var(--bg)}
#side a.dy .n{flex:none;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
#side a.dy .tt{flex:1;min-width:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#side a.dy .now{flex:none;font-size:10px;font-weight:800;padding:2px 6px;border-radius:99px;background:var(--blue);color:#fff}
#side a.dy.on{background:#e8f3f9}
#side a.dy.on .n{background:var(--c);color:#fff}
#side .sub{margin:2px 0 6px 24px;padding-left:12px;border-left:2px solid var(--line)}
#side .sub a{display:block;padding:5px 10px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500}
#side .sub a:hover{background:var(--bg);color:var(--navy)}
#side .sub a.on{color:var(--navy);font-weight:700;background:#f1f6fa}

/* Hover und Fokus */
.tile .ic,.dayc .num,.extra .ic,.today .big{transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s,color .2s,box-shadow .2s}
.tile .foot .ico,.dayc .chev,.extra .go,.today .go .ico,.pager .ico{transition:transform .2s ease}
.tile:before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--c);opacity:0;transition:opacity .2s;pointer-events:none}
@media (hover:hover){
  a.tile:hover:before{opacity:.55}
  a.tile:hover .ic{transform:scale(1.08) rotate(-4deg);background:var(--c);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 35%,transparent)}
  a.tile.primary:hover{box-shadow:0 14px 34px rgba(0,119,166,.35)}
  a.tile.primary:hover .ic{background:#fff;color:var(--blue)}
  a.tile:hover .foot .ico{transform:translateX(5px)}
  .dayc:hover{border-color:var(--c)!important}
  .dayc:hover .num{background:var(--c);color:#fff;transform:scale(1.06)}
  .dayc:hover .chev{transform:translateX(4px);color:var(--c)}
  .dayc:hover .t{color:var(--navy)}
  .today:hover .big{transform:scale(1.06) rotate(-3deg)}
  .today:hover .go .ico{transform:translateX(4px)}
  .extra:hover{border-color:var(--extra);background:#efe6fa}
  .extra:hover .ic{transform:scale(1.08) rotate(90deg)}
  .extra:hover .go{transform:translateX(4px)}
  .pager a:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
  .pager a:hover .ico{transform:translateX(3px)}
  .pager a:first-child:hover .ico{transform:translateX(-3px)}
  .bar .back:hover .ico{transform:translateX(-3px)}
  .iconbtn:hover{background:#fff5f5;color:#b3261e;border-color:#f1c9c9}
}
.bar .back .ico{transition:transform .2s}

  `</div></section>`;
  h += `<section class="sec fade"><div class="sec-h"><span class="dot" style="background:${c}"></span><h2>Spielen und üben</h2></div><div class="tiles">`+
    tile({href:`games/galgen.html?tag=${n}`, ic:"hang", t:"Galgenmännchen", s:"Fachbegriffe des Tages erraten. Die Erklärung hilft.", c:"#d0731c", foot:"Spielen", ext:false})+
    tile({href:`games/fighter.html?tag=${n}`, ic:"rocket", t:"Word-Fighter", s:"Fliegen und den richtigen Begriff abschießen.", c:"#7048b0", foot:"Spielen", ext:false})+
  `</div></section>`;
  h += `<section class="sec fade"><a class="extra" href="#tag${pad(n)}/zusatz"><span class="ic">${I("plus")}</span>
     <span class="txt"><div class="t">Zusatz <span>(freiwillig)</span></div><div class="s">Aufgabenheft mit Lösungen und Übungsquiz zum Vertiefen</div></span><span class="go">${I("right")}</span></a></section>`;
  h += pager(n);
  return h;
}

function zusatzView(n){
  const d = DAYS.find(x=>x.n===n); const p = `tag${pad(n)}/zusatz/`, c = "var(--extra)";
  return `<section class="dhero extra-h fade"><div class="row"><span class="teil">Zusatz (freiwillig)</span><span class="date">Tag ${n} · ${esc(d.weekday)}, ${esc(d.date)}</span></div>
    <h1>Zusatz (freiwillig) zu Tag ${n}</h1><div class="lk">${esc(d.title)}</div>
    <div class="merk" style="background:var(--extra-bg);border-color:var(--extra);color:#4b2c84"><b style="color:var(--extra)">Freiwillig.</b> Diese Aufgaben helfen beim Üben zu Hause und bei der Vorbereitung auf die Klausur. Erst selbst lösen, dann mit der Lösung vergleichen.</div></section>
  <section class="sec fade"><div class="tiles">`+
    tile({href:p+"aufgabenheft.pdf", ic:"pen", t:"Aufgabenheft (freiwillig)", s:`${d.ah_n} Aufgaben inkl. Fallstudie, etwa ${d.ah_min} Minuten`, c, cls:"extra", foot:"PDF öffnen"})+
    tile({href:p+"aufgabenheft_loesung.pdf", ic:"key", t:"Lösungen zum Aufgabenheft", s:"Musterlösungen mit Erwartungshorizont", c, cls:"extra", foot:"PDF öffnen"})+
    tile({href:p+"uebungsquiz.html", ic:"puzzle", t:"Übungsquiz (freiwillig)", s:"60 neue Fragen zum Tag", c, cls:"extra", foot:"Quiz starten"})+
  `</div></section>
  <div class="pager"><a href="#tag${pad(n)}">${I("left")}Zurück zu Tag ${n}</a><span></span></div>`;
}

function mediaView(n, kind){
  const v = media(n, kind), t = kind==="video" ? "Video" : "Podcast", d = DAYS.find(x=>x.n===n);
  let body = `<p class="note">${t} folgt.</p>`;
  if (v) {
    const m = v.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if (m) body = `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe>`;
    else if (/\.(mp4|webm|mov)(\?.*)?$/i.test(v)) { const sub = media(n,"untertitel");
      body = `<video src="${esc(v)}" controls preload="metadata" playsinline>${sub?`<track kind="subtitles" src="${esc(sub)}" srclang="de" label="Deutsch" default>`:""}</video>`+
        (sub?`<p class="note" style="margin:10px 2px 0">Untertitel sind eingeschaltet. Über das Menü im Player (CC oder ⋮) lassen sie sich aus- und einschalten.</p>`:""); }
    else if (/\.(mp3|m4a|wav|ogg)(\?.*)?$/i.test(v)) body = `<audio src="${esc(v)}" controls preload="metadata"></audio>`;
    else body = `<p><a style="color:var(--blue);font-weight:600" href="${esc(v)}" target="_blank" rel="noopener">${t} öffnen</a></p>`;
  }
  return `<section class="dhero fade" style="--c:${TCOL[d.teil]}"><div class="row"><span class="teil">${t}</span><span class="date">Tag ${n} · ${esc(d.date)}</span></div><h1>${esc(d.title)}</h1></section>
    <section class="sec fade"><div class="media">${body}</div></section>
    <div class="pager"><a href="#tag${pad(n)}">${I("left")}Zurück zu Tag ${n}</a><span></span></div>`;
}


const LANGS = [["de","Deutsch"],["fa","فارسی"],["ru","Русский"]];
let gLang = (()=>{ try{ return localStorage.getItem("kba015_lang")||"de"; }catch(e){ return "de"; } })();
let gQuery = "";
function glossarView(dayFilter){
  const G = window.GLOSSAR || [];
  const chips = `<button data-d="0" class="${!dayFilter?"on":""}">Alle Tage</button>` + DAYS.map(d=>`<button data-d="${d.n}" class="${dayFilter===d.n?"on":""}">Tag ${d.n}</button>`).join("");
  return `<section class="dhero fade" style="--c:#1d8a6b"><div class="row"><span class="teil">Glossar</span><span class="date">${dayFilter?`Tag ${dayFilter} · ${esc(DAYS[dayFilter-1].title)}`:"Alle Fachbegriffe des Kurses"}</span></div>
    <h1>Fachbegriffe einfach erklärt</h1><div class="lk">Wählen Sie Ihre Sprache. Der deutsche Fachbegriff steht immer dabei, denn so heißt er in der Prüfung.</div></section>
    <div class="gtools"><div class="seg" id="gseg">${LANGS.map(([k,l])=>`<button data-l="${k}" class="${gLang===k?"on":""}"><span class="${k==="fa"?"fa":""}">${l}</span></button>`).join("")}</div>
    <label class="gsearch">${I("search")}<input id="gq" type="search" placeholder="Begriff suchen" value="${esc(gQuery)}"></label></div>
    <div class="chips" id="gchips">${chips}</div><div class="gcount" id="gcount"></div><div class="glist" id="glist"></div>
    ${dayFilter?`<div class="pager"><a href="#tag${pad(dayFilter)}">${I("left")}Zurück zu Tag ${dayFilter}</a><span></span></div>`:""}`;
}
function glossarBind(dayFilter){
  const G = (window.GLOSSAR || []).slice().sort((a,b)=>a.de_begriff.localeCompare(b.de_begriff,"de"));
  const norm = t => String(t||"").toLowerCase();
  function draw(){
    const q = norm(gQuery.trim());
    const L = G.filter(g => (!dayFilter || g.tag===dayFilter) && (!q || [g.de_begriff,g.de,g.fa_begriff,g.fa,g.ru_begriff,g.ru].some(x=>norm(x).includes(q))));
    $("#gcount").textContent = `${L.length} ${L.length===1?"Begriff":"Begriffe"}`;
    $("#glist").innerHTML = L.length ? L.map(g=>{
      const rtl = gLang==="fa" ? ' dir="rtl" lang="fa"' : gLang==="ru" ? ' lang="ru"' : "";
      const tr = gLang==="de" ? "" : `<div class="tr"${rtl}>${esc(g[gLang+"_begriff"]||"")}</div>`;
      const ex = gLang==="de" ? g.de : (g[gLang]||g.de);
      const deBox = gLang==="de" ? "" : `<details><summary>Erklärung auf Deutsch</summary><p>${esc(g.de)}</p></details>`;
      return `<article class="gcard"><div class="top"><div class="de" lang="de">${esc(g.de_begriff)}</div><a class="tg" href="#tag${pad(g.tag)}">Tag ${g.tag}</a></div>${tr}<div class="ex"${rtl}>${esc(ex)}</div>${deBox}</article>`;
    }).join("") : `<div class="empty">Kein Begriff gefunden.</div>`;
  }
  $("#gseg").onclick = e => { const b = e.target.closest("button"); if(!b) return; gLang = b.dataset.l; try{ localStorage.setItem("kba015_lang", gLang); }catch(x){}
    document.querySelectorAll("#gseg button").forEach(x=>x.classList.toggle("on", x===b)); draw(); };
  $("#gq").oninput = e => { gQuery = e.target.value; draw(); };
  $("#gchips").onclick = e => { const b = e.target.closest("button"); if(!b) return; const d = +b.dataset.d; location.hash = d ? `#glossar/tag${pad(d)}` : "#glossar"; };
  draw();
}


function skriptTile(d, p, c){
  const L = [["de","Deutsch","skript.pdf"],["fa","فارسی","skript_fa.pdf"],["ru","Русский","skript_ru.pdf"]].filter(x => x[0]==="de" || (d.sk_langs||[]).includes(x[0]));
  return `<div class="tile sk" style="--c:${c}"><span class="ic">${I("book")}</span>
    <span class="body"><div class="t">Skript</div><div class="s">${d.seiten} Seiten mit Übungen und Lösungen${L.length>1?". Auch übersetzt zur Auswahl":""}</div></span>
    <span class="langs">${L.map(([k,l,f])=>`<a href="${p+f}" target="_blank" rel="noopener" class="${k}">${l}</a>`).join("")}</span></div>`;
}


function side(){
  const hs = location.hash || "#";
  const m = hs.match(/^#(?:glossar\/)?tag(\d{2})/); const cur = m ? parseInt(m[1],10) : 0;
  const isOn = x => hs === x ? "on" : "";
  let s = `<div class="grp">Kurs</div>
    <a class="nv ${hs==="#"||hs===""?"on":""}" href="#">${I("layers")}Übersicht</a>
    <a class="nv ${hs.startsWith("#glossar")&&!cur?"on":""}" href="#glossar">${I("glos")}Glossar</a>
    <a class="nv" href="quiz-trainer.html" target="_blank" rel="noopener">${I("target")}Quiz-Trainer</a>
    <a class="nv" href="gesamtskript.pdf" target="_blank" rel="noopener">${I("lib")}Gesamtskript</a>
    <a class="nv" href="games/grundlagen.html">${I("calc")}Kaufm. Grundlagen</a>
    <a class="nv" href="games/galgen.html?tag=0">${I("hang")}Galgenmännchen</a>
    <a class="nv" href="games/fighter.html?tag=0">${I("rocket")}Word-Fighter</a>`;
  for (const k of Object.keys(TEILE)) {
    const ds = DAYS.filter(d => String(d.teil)===k); if (!ds.length) continue;
    s += `<div class="grp">${esc(TEILE[k])}</div>`;
    for (const d of ds) {
      const tg = `#tag${pad(d.n)}`;
      s += `<a class="dy ${cur===d.n?"on":""}" href="${tg}" style="--c:${TCOL[d.teil]}" title="${esc(d.title)}"><span class="n">${d.n}</span><span class="tt">${esc(d.title)}</span>${status(d)==="now"?'<span class="now">Heute</span>':""}</a>`;
      if (cur===d.n) {
        const p = `tag${pad(d.n)}/`;
        s += `<div class="sub">
          <a href="${p}praesentation.pdf" target="_blank" rel="noopener">Präsentation</a>
          <a href="${p}skript.pdf" target="_blank" rel="noopener">Skript</a>
          <a href="${p}quiz.html">Quiz des Tages</a>
          <a class="${isOn("#glossar/tag"+pad(d.n))}" href="#glossar/tag${pad(d.n)}">Fachbegriffe</a>
          ${media(d.n,"video")?`<a class="${isOn(tg+"/video")}" href="${tg}/video">Video</a>`:""}
          ${media(d.n,"podcast")?`<a class="${isOn(tg+"/podcast")}" href="${tg}/podcast">Podcast</a>`:""}
          <a href="games/galgen.html?tag=${d.n}">Galgenmännchen</a>
          <a href="games/fighter.html?tag=${d.n}">Word-Fighter</a>
          <a class="${isOn(tg+"/zusatz")}" href="${tg}/zusatz">Zusatz (freiwillig)</a></div>`;
      }
    }
  }
  $("#side").innerHTML = s;
  const on = $("#side .dy.on"); if (on && on.scrollIntoViewIfNeeded) on.scrollIntoViewIfNeeded(false);
}

function pager(n){
  const prev = n>1 ? `<a href="#tag${pad(n-1)}">${I("left")}Tag ${n-1}</a>` : "<span></span>";
  const next = n<DAYS.length ? `<a href="#tag${pad(n+1)}">Tag ${n+1}${I("right")}</a>` : "<span></span>";
  return `<div class="pager">${prev}${next}</div>`;
}

function route(){
  const m = location.hash.match(/^#tag(\d{2})(?:\/(zusatz|video|podcast))?$/);
  const gm = location.hash.match(/^#glossar(?:\/tag(\d{2}))?$/);
  let h, back = null, gday = null;
  if (gm) { gday = gm[1] ? parseInt(gm[1],10) : 0; h = glossarView(gday); back = gday ? {href:`#tag${pad(gday)}`, label:`Tag ${gday}`} : {href:"#", label:"Übersicht"}; }
  else if (!m) h = dashboard();
  else {
    const n = parseInt(m[1],10);
    if (!m[2]) { h = dayView(n); back = {href:"#", label:"Übersicht"}; }
    else if (m[2]==="zusatz") { h = zusatzView(n); back = {href:`#tag${pad(n)}`, label:`Tag ${n}`}; }
    else { h = mediaView(n, m[2]); back = {href:`#tag${pad(n)}`, label:`Tag ${n}`}; }
  }
  $("#bar").innerHTML = bar(back); side();
  $("#view").innerHTML = h; if (gm) glossarBind(gday); window.scrollTo(0,0);
}
function start(){ $("#gate").hidden = true; $("#app").hidden = false; route(); }
window.addEventListener("hashchange", () => { if (ok()) route(); });
if (ok()) start(); else { $("#gate").hidden = false; setTimeout(()=>$("#code").focus(), 50); }
</script>
</body></html>
