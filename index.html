}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}

.bar .back:hover{background:var(--bg)}

.iconbtn:hover{color:var(--navy);border-color:#c9d5e0}
.iconbtn .ico{width:18px;height:18px}

.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 60px}

.today .big small{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85;margin-bottom:3px}
.today .txt{flex:1;min-width:0}
.today .k{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.today .h{font-size:18px;font-weight:700;color:var(--navy);margin-top:2px}
.today .go{flex:none;display:flex;align-items:center;gap:6px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;padding:11px 16px;border-radius:12px}

.dayc .txt{flex:1;min-width:0}
.dayc .d{font-size:12.5px;color:var(--muted);font-weight:500}
.dayc .t{font-size:15.5px;font-weight:700;color:var(--ink);margin-top:2px;line-height:1.3}
.dayc .chev{flex:none;color:#a7b4c1}
.dayc.is-today{border:2px solid var(--blue);padding:13px 15px}
.dayc.is-done .num{background:#eef2f5;color:#8a99a8}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.now{background:var(--blue);color:#fff}

.tile .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--c)}

#gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 10%,#0a6f9e 0,transparent 45%),linear-gradient(140deg,#002a52,#003a6b 50%,#0077A6)}

#gate button:hover{background:#00668f}
#gate .err{color:#b3261e;font-size:13px;min-height:18px;margin-top:10px}
#gate .shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#gate .fine{margin-top:16px;font-size:11.5px;color:#8a99a8}

.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Tablet */
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}

@media (max-width:640px){

  .dayc{padding:12px 14px}

  .tile .ic{flex:none;width:46px;height:46px}
  .tile .body{flex:1;min-width:0}
  .tile .foot{margin:0;flex:none}
  .tile .foot span{display:none}
  .pill{position:static;order:3;flex:none}

  .dhero{padding:20px 18px;border-radius:20px}
  .dhero h1{font-size:22px}
  .extra{padding:16px;gap:14px}
  .extra .ic{width:46px;height:46px}
  .pager a{flex:1;justify-content:center;padding:12px}
  .sec{margin-top:24px}

const P = {
  slides:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M7 9h6M7 12h4"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7M8 11h5"/>',
  play:'<rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/>',
  head:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.6"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.6"/>',
  check:'<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12.3 2.8 2.8L16.3 9.4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M16 7l2.5 2.5M14 9l2 2"/>',
  pen:'<path d="M14.5 4.5l5 5L9 20H4v-5z"/><path d="m12.5 6.5 5 5"/>',
  puzzle:'<path d="M10 4a2 2 0 1 1 4 0v2h4v4h-2a2 2 0 1 0 0 4h2v4h-4v-2a2 2 0 1 0-4 0v2H6v-4h2a2 2 0 1 0 0-4H6V6h4z"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
  lib:'<path d="M5 4h3v16H5zM10 4h3v16h-3z"/><path d="m15.5 4.6 2.9-.8 3.6 15.4-2.9.8z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  left:'<path d="M15 6l-6 6 6 6"/>', right:'<path d="M9 6l6 6-6 6"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  user:'<circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>',
  out:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l4-4-4-4M14 12H4"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>'
};
const I = (k, cls="ico") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;

async function sha(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function ok(){ try{ return localStorage.getItem("kba015_ok")==="1"; }catch(e){ return window._ok===true; } }
function logout(){ try{ localStorage.removeItem("kba015_ok"); }catch(e){} location.hash=""; location.reload(); }
$("#gf").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("#code").value.trim().toUpperCase().replace(/[\s-]/g, "");
  if (await sha(v) === HASH) { try{ localStorage.setItem("kba015_ok","1"); }catch(e){ window._ok=true; } start(); }
  else { $("#err").textContent = "Der Code stimmt leider nicht."; const b=$("#gbox"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
});

const toDate = s => { const [d,m,y] = s.split(".").map(Number); return new Date(y, m-1, d); };
function nowDay(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function status(d){ const a = toDate(d.date).getTime(), t = nowDay().getTime(); return a===t ? "now" : a<t ? "done" : "next"; }

function bar(back){
  return (back ? `<a class="back" href="${back.href}">${I("left")}<span>${esc(back.label)}</span></a>`
               : `<img src="assets/logo.png" alt="Waybuild Akademie"><div class="kurs">KBA-015 Eigene Rolle im Betrieb<small>Waybuild Akademie</small></div>`) +
    `<div class="sp"></div><button class="iconbtn" onclick="logout()" title="Abmelden">${I("out")}<span>Abmelden</span></button>`;
}

function tile({href, ic, t, s, c="var(--blue)", foot="Öffnen", cls="", pill="", ext=true}){
  const tag = href ? "a" : "div";
  const attrs = href ? `href="${href}" ${ext && !href.startsWith("#") ? 'target="_blank" rel="noopener"' : ""}` : "";
  return `<${tag} class="tile ${cls} ${pill?"has-pill":""}" ${attrs} style="--c:${c}">
    ${pill?`<span class="pill ${cls.includes("extra")?"f":""}">${pill}</span>`:""}
    <span class="ic">${I(ic)}</span>
    <span class="body"><div class="t">${t}</div><div class="s">${s}</div></span>
    <span class="foot"><span>${foot}</span>${I("arrow")}</span></${tag}>`;
}

function dashboard(){
  const done = DAYS.filter(d => status(d) !== "next").length;
  const cur = DAYS.find(d => status(d) === "now");
  const first = toDate(DAYS[0].date), last = toDate(DAYS[DAYS.length-1].date), t = nowDay();
  let todayCard = "";
  if (cur) todayCard = `<a class="today fade" href="#tag${pad(cur.n)}"><div class="big"><small>Tag</small>${cur.n}</div>
      <div class="txt"><div class="k">Heute · ${esc(cur.weekday)}, ${esc(cur.date)}</div><div class="h">${esc(cur.title)}</div></div>
      <span class="go">Zum Tag ${I("arrow")}</span></a>`;
  else if (t < first) todayCard = `<div class="today fade" style="border-color:var(--line)"><div class="big" style="background:#eef2f5;color:var(--navy)">${I("cal")}</div><div class="txt"><div class="k">Bald geht es los</div><div class="h">Der Kurs startet am ${esc(DAYS[0].date)}</div></div></div>`;
  else if (t > last) todayCard = `<div class="today fade" style="border-color:var(--t2)"><div class="big" style="background:var(--t2)">${I("check")}</div><div class="txt"><div class="k" style="color:var(--t2)">Kurs abgeschlossen</div><div class="h">Alle Inhalte bleiben hier zum Wiederholen.</div></div></div>`;

  let h = `<section class="hero fade"><div class="eyebrow">Waybuild Akademie · Lernbereich</div>
    <h1>Die eigene Rolle im Betrieb mitgestalten und den Betrieb präsentieren</h1>
    <div class="meta"><span class="chip">${I("layers")}KBA-015</span><span class="chip">${I("cal")}${esc(ZEITRAUM)}</span><span class="chip">${I("user")}${esc(DOZENT)}</span></div>
    <div class="progress"><div class="lbl"><span>Fortschritt</span><span>${done} von ${DAYS.length} Tagen</span></div><div class="track"><div class="fill" style="width:${Math.round(done/DAYS.length*100)}%"></div></div></div>
  </section>${todayCard}`;

  for (const k of Object.keys(TEILE)) {
    const ds = DAYS.filter(d => String(d.teil)===k); if(!ds.length) continue;
    h += `<section class="sec fade"><div class="sec-h"><span class="dot" style="background:${TCOL[k]}"></span><h2>${esc(TEILE[k])}</h2><span class="cnt">${ds.length} ${ds.length===1?"Tag":"Tage"}</span></div><div class="days">`;
    for (const d of ds) {
      const st = status(d);
      h += `<a class="dayc ${st==="now"?"is-today":""} ${st==="done"?"is-done":""}" href="#tag${pad(d.n)}" style="--c:${TCOL[k]}">
        <span class="num"><small>Tag</small>${d.n}</span>
        <span class="txt"><div class="d">${esc(d.weekday)}, ${esc(d.date)}${st==="now"?'<span class="tag now">Heute</span>':st==="done"?'<span class="tag done">vorbei</span>':""}</div><div class="t">${esc(d.title)}</div></span>
        <span class="chev">${I("right")}</span></a>`;
    }
    h += `</div></section>`;
  }
  h += `<section class="sec fade"><div class="sec-h"><span class="dot" style="background:var(--navy)"></span><h2>Für den ganzen Kurs</h2></div><div class="tiles">`+
    tile({href:"quiz-trainer.html", ic:"target", t:"Quiz-Trainer", s:"Alle Fragen aller Tage. Üben oder Probeklausur mit 30 Fragen.", c:"var(--navy)", foot:"Trainieren"})+
    tile({href:"gesamtskript.pdf", ic:"lib", t:"Gesamtskript", s:"Alle Skripte mit Lösungen und Glossar als PDF.", c:"var(--navy)", foot:"PDF öffnen"})+
  `</div></section>`;
  return h;
}

function media(n, kind){ return ((MEDIA["tag"+pad(n)]||{})[kind]||"").trim(); }

function dayView(n){
  const d = DAYS.find(x=>x.n===n); if(!d) return dashboard();
  const p = `tag${pad(n)}/`, c = TCOL[d.teil];
  const vid = media(n,"video"), pod = media(n,"podcast");
  let h = `<section class="dhero fade" style="--c:${c}"><div class="row"><span class="teil">${esc(TEILE[d.teil])}</span><span class="date">Tag ${n} · ${esc(d.weekday)}, ${esc(d.date)}</span></div>
    <h1>${esc(d.title)}</h1><div class="lk">Lernkompass ${esc(d.lk)}</div>
    ${d.merksatz?`<div class="merk"><b>Merksatz.</b> ${esc(d.merksatz)}</div>`:""}</section>`;
  h += `<section class="sec fade"><div class="sec-h"><span class="dot" style="background:${c}"></span><h2>Unterricht</h2></div><div class="tiles">`+
    tile({href:p+"praesentation.pdf", ic:"slides", t:"Präsentation", s:`${d.folien} Folien als PDF`, c, foot:"PDF öffnen"})+
    tile({href:p+"skript.pdf", ic:"book", t:"Skript", s:`${d.seiten} Seiten mit Übungen und Lösungen`, c, foot:"PDF öffnen"})+
    tile({href:p+"quiz.html", ic:"check", t:"Quiz des Tages", s:"60 Fragen mit Auswertung und Erklärungen", cls:"primary", foot:"Quiz starten"})+
  `</div></section>`;
  h += `<section class="sec fade"><div class="sec-h"><span class="dot" style="background:${c}"></span><h2>Video und Podcast</h2></div><div class="tiles">`+
    (vid ? tile({href:`#tag${pad(n)}/video`, ic:"play", t:"Video", s:"Erklärvideo zum Tag", c:"#c0394f", foot:"Ansehen"})
         : tile({ic:"play", t:"Video", s:"Wird nach dem Unterricht ergänzt", cls:"soon", pill:"folgt"}))+
    (pod ? tile({href:`#tag${pad(n)}/podcast`, ic:"head", t:"Podcast", s:"Den Tag zum Anhören", c:"#1d8a6b", foot:"Anhören"})
         : tile({ic:"head", t:"Podcast", s:"Wird nach dem Unterricht ergänzt", cls:"soon", pill:"folgt"}))+
  `</div></section>`;
  h += `<section class="sec fade"><a class="extra" href="#tag${pad(n)}/zusatz"><span class="ic">${I("plus")}</span>
     <span class="txt"><div class="t">Zusatz <span>(freiwillig)</span></div><div class="s">Aufgabenheft mit Lösungen und Übungsquiz zum Vertiefen</div></span><span class="go">${I("right")}</span></a></section>`;
  h += pager(n);
  return h;
}

function zusatzView(n){
  const d = DAYS.find(x=>x.n===n); const p = `tag${pad(n)}/zusatz/`, c = "var(--extra)";
  return `<section class="dhero extra-h fade"><div class="row"><span class="teil">Zusatz (freiwillig)</span><span class="date">Tag ${n} · ${esc(d.weekday)}, ${esc(d.date)}</span></div>
    <h1>Zusatz (freiwillig) zu Tag ${n}</h1><div class="lk">${esc(d.title)}</div>
    <div class="merk" style="background:var(--extra-bg);border-color:var(--extra);color:#4b2c84"><b style="color:var(--extra)">Freiwillig.</b> Diese Aufgaben helfen beim Üben zu Hause und bei der Vorbereitung auf die Klausur. Erst selbst lösen, dann mit der Lösung vergleichen.</div></section>
  <section class="sec fade"><div class="tiles">`+
    tile({href:p+"aufgabenheft.pdf", ic:"pen", t:"Aufgabenheft (freiwillig)", s:`${d.ah_n} Aufgaben inkl. Fallstudie, etwa ${d.ah_min} Minuten`, c, cls:"extra", foot:"PDF öffnen"})+
    tile({href:p+"aufgabenheft_loesung.pdf", ic:"key", t:"Lösungen zum Aufgabenheft", s:"Musterlösungen mit Erwartungshorizont", c, cls:"extra", foot:"PDF öffnen"})+
    tile({href:p+"uebungsquiz.html", ic:"puzzle", t:"Übungsquiz (freiwillig)", s:"60 neue Fragen zum Tag", c, cls:"extra", foot:"Quiz starten"})+
  `</div></section>
  <div class="pager"><a href="#tag${pad(n)}">${I("left")}Zurück zu Tag ${n}</a><span></span></div>`;
}

function mediaView(n, kind){
  const v = media(n, kind), t = kind==="video" ? "Video" : "Podcast", d = DAYS.find(x=>x.n===n);
  let body = `<p class="note">${t} folgt.</p>`;
  if (v) {
    const m = v.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if (m) body = `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe>`;
    else if (/\.(mp4|webm|mov)(\?.*)?$/i.test(v)) body = `<video src="${esc(v)}" controls preload="metadata" playsinline></video>`;
    else if (/\.(mp3|m4a|wav|ogg)(\?.*)?$/i.test(v)) body = `<audio src="${esc(v)}" controls preload="metadata"></audio>`;
    else body = `<p><a style="color:var(--blue);font-weight:600" href="${esc(v)}" target="_blank" rel="noopener">${t} öffnen</a></p>`;
  }
  return `<section class="dhero fade" style="--c:${TCOL[d.teil]}"><div class="row"><span class="teil">${t}</span><span class="date">Tag ${n} · ${esc(d.date)}</span></div><h1>${esc(d.title)}</h1></section>
    <section class="sec fade"><div class="media">${body}</div></section>
    <div class="pager"><a href="#tag${pad(n)}">${I("left")}Zurück zu Tag ${n}</a><span></span></div>`;
}

function pager(n){
  const prev = n>1 ? `<a href="#tag${pad(n-1)}">${I("left")}Tag ${n-1}</a>` : "<span></span>";
  const next = n<DAYS.length ? `<a href="#tag${pad(n+1)}">Tag ${n+1}${I("right")}</a>` : "<span></span>";
  return `<div class="pager">${prev}${next}</div>`;
}

function route(){
  const m = location.hash.match(/^#tag(\d{2})(?:\/(zusatz|video|podcast))?$/);
  let h, back = null;
  if (!m) h = dashboard();
  else {
    const n = parseInt(m[1],10);
    if (!m[2]) { h = dayView(n); back = {href:"#", label:"Übersicht"}; }
    else if (m[2]==="zusatz") { h = zusatzView(n); back = {href:`#tag${pad(n)}`, label:`Tag ${n}`}; }
    else { h = mediaView(n, m[2]); back = {href:`#tag${pad(n)}`, label:`Tag ${n}`}; }
  }
  $("#bar").innerHTML = bar(back);
  $("#view").innerHTML = h; window.scrollTo(0,0);
}
function start(){ $("#gate").hidden = true; $("#app").hidden = false; route(); }
window.addEventListener("hashchange", () => { if (ok()) route(); });
if (ok()) start(); else { $("#gate").hidden = false; setTimeout(()=>$("#code").focus(), 50); }
</script>
</body></html>
