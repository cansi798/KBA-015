<script>
"use strict";
/* ========== Hilfen ========== */
const $ = s => document.querySelector(s);
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const r2 = x => Math.round(x*100)/100;
function z(x, dec){ /* deutsche Zahl */
  x = r2(x);
  const d = dec !== undefined ? dec : (Number.isInteger(x) ? 0 : 2);
  return x.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
}
const eur = x => z(x, Number.isInteger(r2(x)) ? 0 : 2) + " €";
function parseNum(s){
  s = String(s).replace(/[€%\s]/g,"").replace(/[^\d.,\-]/g,"");
  if (!s) return NaN;
  if (s.includes(",") && s.includes(".")) s = s.replace(/\./g,"").replace(",",".");
  else if (s.includes(",")) s = s.replace(",",".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  return parseFloat(s);
}
function grid(k){ let h='<div class="grid100">'; for(let i=0;i<100;i++) h+=`<i class="${i<k?"on":""}"></i>`; return h+'</div>'; }
const nb = x => String(x).replace(/ (€|%)/g,"&nbsp;$1");
function dtab(rows){ /* rows [ [links, rechts, op] ] */
  rows = rows.map(r => r.map(nb));
  return '<table class="dt">'+rows.map(r=>`<tr><td class="l">${r[0]}</td><td>➜</td><td class="r">${r[1]}</td><td class="op">${r[2]||""}</td></tr>`).join("")+'</table>';
}
const KEY = "kba015_kg";
let S; try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ S = {}; }
S.xp = S.xp || 0; S.p = S.p || {}; S.d = S.d || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ========== Inhalte ========== */
const T = {};

/* ---------- PROZENTRECHNEN ---------- */
T.prozent = { name:"Prozentrechnen", emo:"💯", c:"#0077A6",
 desc:"Von ganz am Anfang bis zur Rechnung mit Umsatzsteuer und Skonto.",
 sheet:`<table>
  <tr><th>Wort</th><th>Bedeutung</th><th>Beispiel</th></tr>
  <tr><td><b>Grundwert</b></td><td>das Ganze, immer 100 %</td><td>der ganze Preis 200 €</td></tr>
  <tr><td><b>Prozentsatz</b></td><td>wie viel Prozent, Zahl mit %</td><td>10 %</td></tr>
  <tr><td><b>Prozentwert</b></td><td>der Teil vom Ganzen</td><td>20 €</td></tr>
  <tr><td><b>Prozentwert finden</b></td><td>Grundwert : 100 × Prozentsatz</td><td>200 : 100 × 10 = 20</td></tr>
  <tr><td><b>Prozentsatz finden</b></td><td>Prozentwert : Grundwert × 100</td><td>20 : 200 × 100 = 10</td></tr>
  <tr><td><b>Grundwert finden</b></td><td>Prozentwert : Prozentsatz × 100</td><td>20 : 10 × 100 = 200</td></tr>
  <tr><td><b>Netto zu Brutto</b></td><td>Netto × 1,19</td><td>100 € × 1,19 = 119 €</td></tr>
  <tr><td><b>Brutto zu Netto</b></td><td>Brutto : 1,19</td><td>119 € : 1,19 = 100 €</td></tr>
 </table><p class="small">Der Trick für alles bleibt gleich. Zuerst 1 % ausrechnen. Dann mal die Prozent nehmen, die Sie brauchen.</p>`,
 levels:[
 { t:"Was ist ein Prozent?", s:"1 von 100",
   learn:`<p>Das Wort <b>Prozent</b> heißt <b>von hundert</b>.</p>
   <p>Stellen Sie sich eine Tafel Schokolade mit <b>100 Stückchen</b> vor. Sie essen 1 Stückchen. Dann haben Sie <b>1 Prozent</b> gegessen. Man schreibt <b>1 %</b>.</p>
   <div class="box bild"><div class="h">So sieht das aus</div>Hier sind 30 von 100 Kästchen blau. Das sind <b>30 %</b>.${grid(30)}</div>
   <div class="box merke"><div class="h">Merke</div>Das Zeichen <b>%</b> heißt Prozent.<br>100 % ist <b>alles</b>, also das Ganze.<br>50 % ist die <b>Hälfte</b>.<br>0 % ist <b>gar nichts</b>.</div>`,
   ex:{ q:"In einer Firma arbeiten 100 Menschen. 45 davon fahren mit dem Bus. Wie viel Prozent sind das?",
        steps:["Es sind genau 100 Menschen. Prozent heißt von hundert. Das passt also perfekt.","45 von 100 Menschen fahren Bus.","45 von 100 sind <b>45 %</b>."]},
   gen(){
     const k = pick([10,20,25,30,40,50,60,70,75,80,90,15,35,45,55,65,5,12,8,3]);
     if (Math.random()<.5) return { q:`Wie viel Prozent der Kästchen sind blau? Es sind 100 Kästchen.${grid(k)}`, a:k, u:"%",
        steps:["Zählen Sie die blauen Kästchen. Eine Reihe hat 10 Kästchen.",`Es sind ${k} blaue Kästchen von 100.`,`${k} von 100 sind <b>${k} %</b>.`]};
     const c = pick([["Von 100 Kundinnen und Kunden zahlen %K% mit Karte.","mit Karte"],["Von 100 Briefen sind %K% Rechnungen.","Rechnungen"],["In einer Firma arbeiten 100 Menschen. %K% davon arbeiten im Büro.","im Büro"],["Von 100 Ordnern im Regal sind %K% blau.","blau"]]);
     return { q:c[0].replace("%K%",k)+" Wie viel Prozent sind das?", a:k, u:"%",
        steps:["Das Ganze sind genau 100. Prozent heißt von hundert.",`${k} von 100 sind ${c[1]}.`,`Also sind es <b>${k} %</b>.`]};
   }},
 { t:"Die leichten Prozente", s:"Hälfte, Viertel, Zehntel",
   learn:`<p>Einige Prozente kennen Sie schon aus dem Alltag. Man muss nur <b>teilen</b>.</p>
   <table class="dt">
   <tr><td class="l">100 %</td><td>➜</td><td class="r">alles</td><td class="op">nichts rechnen</td></tr>
   <tr><td class="l">50 %</td><td>➜</td><td class="r">die Hälfte</td><td class="op">geteilt durch 2</td></tr>
   <tr><td class="l">25 %</td><td>➜</td><td class="r">ein Viertel</td><td class="op">geteilt durch 4</td></tr>
   <tr><td class="l">20 %</td><td>➜</td><td class="r">ein Fünftel</td><td class="op">geteilt durch 5</td></tr>
   <tr><td class="l">10 %</td><td>➜</td><td class="r">ein Zehntel</td><td class="op">geteilt durch 10</td></tr>
   <tr><td class="l">1 %</td><td>➜</td><td class="r">ein Hundertstel</td><td class="op">geteilt durch 100</td></tr></table>
   <div class="box bild"><div class="h">Bild im Kopf</div>Eine Pizza hat 4 Stücke. Ein Stück ist ein Viertel. Ein Viertel ist <b>25 %</b>.</div>
   <div class="box tipp"><div class="h">Trick für 10 %</div>Bei 10 % nehmen Sie einfach die letzte Null weg.<br>10 % von 70 € sind 7 €.<br>10 % von 300 € sind 30 €.</div>
   <p class="small">Das Zeichen : heißt geteilt durch. Das Zeichen × heißt mal.</p>`,
   ex:{ q:"Wie viel sind 25 % von 80 €?", steps:["25 % ist ein Viertel. Also teilen wir durch 4.","80 € : 4 = 20 €.","25 % von 80 € sind <b>20 €</b>."]},
   gen(){
     const p = pick([50,25,10,20,1,50,10]);
     const map = {50:[2,"die Hälfte"],25:[4,"ein Viertel"],20:[5,"ein Fünftel"],10:[10,"ein Zehntel"],1:[100,"ein Hundertstel"]};
     const [d, wort] = map[p];
     const g = p===1 ? ri(1,30)*100 : d*ri(2,p===10?40:30);
     const ctx = pick(["von %G%","von einem Einkauf über %G%","von einem Monatslohn über %G%"]);
     return { q:`Wie viel sind ${p} % ${ctx.replace("%G%",eur(g))}?`, a:g/d, u:"€",
       steps:[`${p} % ist ${wort}. Also teilen wir durch ${d}.`,`${eur(g)} : ${d} = ${eur(g/d)}.`,`${p} % von ${eur(g)} sind <b>${eur(g/d)}</b>.`]};
   }},
 { t:"Jedes Prozent ausrechnen", s:"Der 1-%-Trick",
   learn:`<p>Was ist mit 3 % oder 19 %? Dafür gibt es einen Trick, der <b>immer</b> klappt.</p>
   <div class="box merke"><div class="h">Der 1-%-Trick in 2 Schritten</div><b>Schritt 1.</b> Rechnen Sie zuerst <b>1 %</b> aus. Dafür teilen Sie durch 100.<br><b>Schritt 2.</b> Nehmen Sie das Ergebnis <b>mal</b> die Prozente, die Sie suchen.</div>
   <div class="box bild"><div class="h">Bild im Kopf</div>Sie wissen, was <b>ein</b> Kaugummi kostet. Dann wissen Sie auch, was <b>sieben</b> Kaugummis kosten. Genauso ist es mit 1 % und 7 %.</div>
   <div class="box tipp"><div class="h">Trick für geteilt durch 100</div>Bei geteilt durch 100 nehmen Sie zwei Nullen weg. 600 : 100 = 6.<br>Ohne Nullen rückt das Komma zwei Stellen nach links. 250 : 100 = 2,50.</div>`,
   ex:{ q:"Wie viel sind 7 % von 300 €?", steps:["Schritt 1. Wir rechnen 1 % aus. 300 € : 100 = 3 €.","Schritt 2. Wir brauchen 7 %. Also 3 € × 7 = 21 €.","7 % von 300 € sind <b>21 €</b>."]},
   gen(){
     const g = pick([200,300,400,500,600,800,900,1000,1200,1500,2000,250,450,750,150]);
     const p = pick([2,3,4,5,6,7,8,9,12,15,19,30,40,11]);
     const one = g/100, a = one*p;
     return { q:`Wie viel sind ${p} % von ${eur(g)}?`, a, u:"€",
       steps:[`Schritt 1. 1 % ausrechnen. ${eur(g)} : 100 = ${eur(one)}.`,`Schritt 2. Mal ${p} nehmen. ${eur(one)} × ${p} = ${eur(a)}.`,`${p} % von ${eur(g)} sind <b>${eur(a)}</b>.`]};
   }},
 { t:"Die drei wichtigen Wörter", s:"Grundwert, Prozentsatz, Prozentwert",
   learn:`<p>In der Prüfung stehen oft diese drei Wörter. Sie sind leichter, als sie klingen.</p>
   <table class="dt">
   <tr><td class="l">Grundwert</td><td>➜</td><td class="r">das <b>Ganze</b>. Das sind immer 100 %.</td></tr>
   <tr><td class="l">Prozentsatz</td><td>➜</td><td class="r">die Zahl <b>mit dem %</b>-Zeichen</td></tr>
   <tr><td class="l">Prozentwert</td><td>➜</td><td class="r">der <b>Teil</b> vom Ganzen, meist in €</td></tr></table>
   <div class="box bild"><div class="h">Beispiel</div>Eine Jacke kostet <b>80 €</b>. Sie bekommen <b>25 %</b> Rabatt. Das sind <b>20 €</b>.<br>80 € ist das Ganze, also der <b>Grundwert</b>.<br>25 % ist der <b>Prozentsatz</b>.<br>20 € ist der Teil, also der <b>Prozentwert</b>.</div>
   <div class="box tipp"><div class="h">Eselsbrücke</div><b>G</b>rundwert ist das <b>G</b>anze.<br>Der Prozent<b>satz</b> hat das Zeichen %.<br>Der Prozent<b>wert</b> ist der Teil, der etwas <b>wert</b> ist, also Euro.</div>`,
   ex:{ q:"Von 400 € Lohn spart Lea 10 %. Das sind 40 €. Was ist der Grundwert?", steps:["Wir suchen das Ganze.","Das Ganze ist der ganze Lohn, also 400 €.","Der Grundwert ist <b>400 €</b>. 10 % ist der Prozentsatz und 40 € ist der Prozentwert."]},
   gen(){
     const g = pick([200,400,500,800,1000,1200,2000,600]); const p = pick([5,10,20,25,50,15]); const w = g*p/100;
     const c = pick([[`Ein Laptop kostet ${eur(g)}. Es gibt ${p} % Rabatt. Das sind ${eur(w)}.`],[`Eine Firma hat ${eur(g)} Umsatz am Tag. ${p} % davon kommen aus dem Online-Shop. Das sind ${eur(w)}.`],[`Von ${eur(g)} Lohn gehen ${p} % an die Krankenkasse. Das sind ${eur(w)}.`],[`Eine Rechnung lautet über ${eur(g)}. Der Kunde bekommt ${p} % Nachlass. Das sind ${eur(w)}.`]])[0];
     const ask = pick(["Grundwert","Prozentsatz","Prozentwert"]);
     const opts = [eur(g), p+" %", eur(w)]; const ai = {Grundwert:0,Prozentsatz:1,Prozentwert:2}[ask];
     const why = {Grundwert:`Der Grundwert ist das Ganze. Das Ganze ist ${eur(g)}.`, Prozentsatz:`Der Prozentsatz ist die Zahl mit dem %-Zeichen. Das ist ${p} %.`, Prozentwert:`Der Prozentwert ist der Teil vom Ganzen in Euro. Das ist ${eur(w)}.`}[ask];
     return { q:`${c} Was ist hier der <b>${ask}</b>?`, choices:opts, a:ai, steps:[why]};
   }},
 { t:"Wie viel Prozent sind das?", s:"Den Prozentsatz finden",
   learn:`<p>Jetzt kennen Sie den Teil und das Ganze. Sie suchen, <b>wie viel Prozent</b> das sind.</p>
   <div class="box merke"><div class="h">So geht es in 2 Schritten</div><b>Schritt 1.</b> Teil geteilt durch das Ganze.<br><b>Schritt 2.</b> Das Ergebnis mal 100. Dann haben Sie die Prozent.</div>
   <div class="f">Prozentsatz = Prozentwert : Grundwert × 100</div>
   <div class="box bild"><div class="h">Bild im Kopf</div>Sie haben 20 Fragen. 15 sind richtig. 15 : 20 = 0,75. 0,75 × 100 = 75. Sie haben <b>75 %</b> richtig.</div>
   <div class="box tipp"><div class="h">Mal 100</div>Bei mal 100 rückt das Komma zwei Stellen nach rechts. 0,25 × 100 = 25.</div>`,
   ex:{ q:"Eine Firma hat 120 Mitarbeitende. 30 davon sind Auszubildende. Wie viel Prozent sind das?", steps:["Schritt 1. Teil geteilt durch das Ganze. 30 : 120 = 0,25.","Schritt 2. Mal 100. 0,25 × 100 = 25.","Es sind <b>25 %</b>."]},
   gen(){
     const p = pick([10,20,25,40,50,75,5,15,30,60,80,12]);
     const g = pick([20,40,50,80,100,120,200,250,400,500,600,800,1000].filter(x=>Number.isInteger(x*p/100)));
     const w = g*p/100;
     const c = pick([[`Ein Lager hat ${g} Kartons. ${w} davon sind schon verkauft.`],[`Eine Rechnung lautet über ${eur(g)}. Der Kunde hat schon ${eur(w)} bezahlt.`],[`In einem Kurs sind ${g} Fragen. ${w} Fragen sind richtig.`],[`Eine Firma hat ${eur(g)} Gewinn. ${eur(w)} davon gehen in neue Computer.`]])[0];
     return { q:`${c} Wie viel Prozent sind das?`, a:p, u:"%",
       steps:[`Schritt 1. Teil geteilt durch das Ganze. ${z(w)} : ${z(g)} = ${z(w/g)}.`,`Schritt 2. Mal 100. ${z(w/g)} × 100 = ${p}.`,`Es sind <b>${p} %</b>.`]};
   }},
 { t:"Das Ganze finden", s:"Den Grundwert finden",
   learn:`<p>Jetzt ist es umgekehrt. Sie kennen einen <b>Teil</b> und wie viel Prozent er ist. Sie suchen das <b>Ganze</b>, also 100 %.</p>
   <div class="box merke"><div class="h">Wieder der 1-%-Trick</div><b>Schritt 1.</b> Teil geteilt durch die Prozente. Dann haben Sie <b>1 %</b>.<br><b>Schritt 2.</b> 1 % mal 100. Dann haben Sie <b>100 %</b>, also das Ganze.</div>
   <div class="f">Grundwert = Prozentwert : Prozentsatz × 100</div>
   <div class="box bild"><div class="h">Bild im Kopf</div>Sie haben 10 % Ihres Geldes ausgegeben. Das waren 5 €. Dann ist 1 % gleich 50 Cent. Alles, also 100 %, sind 50 €.</div>`,
   ex:{ q:"15 € sind 5 % von einem Preis. Wie hoch ist der ganze Preis?", steps:["Schritt 1. 1 % ausrechnen. 15 € : 5 = 3 €.","Schritt 2. Das Ganze sind 100 %. 3 € × 100 = 300 €.","Der ganze Preis ist <b>300 €</b>."]},
   gen(){
     const one = pick([2,3,4,5,6,8,10,12,15,20,1.5,2.5]); const p = pick([2,3,4,5,10,20,25,8,15]);
     const w = one*p, g = one*100;
     const c = pick([`Ein Kunde bekommt ${p} % Rabatt. Das sind ${eur(w)}. Wie hoch war der ganze Preis?`,`Lea spart jeden Monat ${p} % von ihrem Geld. Das sind ${eur(w)}. Wie viel Geld hat Lea im Monat?`,`Die Firma zahlt ${p} % Zinsen. Das sind ${eur(w)}. Wie hoch ist das ganze Darlehen?`,`${eur(w)} sind ${p} % von einem Betrag. Wie hoch ist der ganze Betrag?`]);
     return { q:c, a:g, u:"€",
       steps:[`Schritt 1. 1 % ausrechnen. ${eur(w)} : ${p} = ${eur(one)}.`,`Schritt 2. Mal 100 für das Ganze. ${eur(one)} × 100 = ${eur(g)}.`,`Das Ganze ist <b>${eur(g)}</b>.`]};
   }},
 { t:"Rabatt und Aufschlag", s:"Preis wird kleiner oder größer",
   learn:`<p>Im Büro rechnen Sie oft mit Preisen, die <b>kleiner</b> oder <b>größer</b> werden.</p>
   <div class="box merke"><div class="h">Weniger oder mehr</div><b>Rabatt</b> oder <b>Skonto</b> heißt Nachlass. Der Preis wird <b>kleiner</b>. Also <b>minus</b>.<br><b>Aufschlag</b> oder <b>Umsatzsteuer</b> heißt zusätzlich. Der Preis wird <b>größer</b>. Also <b>plus</b>.</div>
   <div class="box bild"><div class="h">Beispiel Rabatt</div>Ein Stuhl kostet 200 €. Es gibt 10 % Rabatt.<br>10 % von 200 € sind 20 €.<br>200 € minus 20 € = <b>180 €</b>.</div>
   <div class="box bild"><div class="h">Beispiel Umsatzsteuer</div>Der Preis ohne Steuer heißt <b>netto</b>. Mit Steuer heißt er <b>brutto</b>. Die Umsatzsteuer ist meistens 19 %.<br>Netto 100 €. 19 % von 100 € sind 19 €.<br>100 € plus 19 € = <b>119 €</b> brutto.</div>
   <div class="box tipp"><div class="h">Profi-Trick</div>10 % Rabatt heißt, Sie zahlen noch 90 %. 200 € × 0,9 = 180 €.<br>19 % Steuer dazu heißt, Sie zahlen 119 %. 100 € × 1,19 = 119 €.</div>`,
   ex:{ q:"Ein Drucker kostet 300 € netto. Wie viel kostet er brutto mit 19 % Umsatzsteuer?", steps:["Schritt 1. 1 % von 300 € = 3 €.","Schritt 2. 19 % sind 3 € × 19 = 57 €.","Schritt 3. Steuer kommt dazu, also plus. 300 € + 57 € = <b>357 €</b>."]},
   gen(){
     if (Math.random()<.5){
       const g = pick([100,200,300,400,500,600,800,1000,1200,1500]); const p = pick([5,10,15,20,25,30]); const w = g*p/100;
       const it = pick(["Ein Bürostuhl","Ein Schreibtisch","Ein Bildschirm","Ein Regal","Ein Drucker"]);
       return { q:`${it} kostet ${eur(g)}. Es gibt ${p} % Rabatt. Wie viel müssen Sie noch bezahlen?`, a:g-w, u:"€",
         steps:[`Schritt 1. Rabatt ausrechnen. 1 % von ${eur(g)} = ${eur(g/100)}. Mal ${p} = ${eur(w)}.`,`Schritt 2. Rabatt heißt weniger, also minus. ${eur(g)} minus ${eur(w)} = ${eur(g-w)}.`,`Sie zahlen noch <b>${eur(g-w)}</b>.`]};
     }
     const g = pick([100,200,300,400,500,600,700,800,1000,1200,2000]); const w = g*19/100;
     return { q:`Eine Ware kostet ${eur(g)} netto. Wie viel kostet sie brutto mit 19 % Umsatzsteuer?`, a:g+w, u:"€",
       steps:[`Schritt 1. 1 % von ${eur(g)} = ${eur(g/100)}.`,`Schritt 2. 19 % sind ${eur(g/100)} × 19 = ${eur(w)}.`,`Schritt 3. Steuer kommt dazu, also plus. ${eur(g)} + ${eur(w)} = <b>${eur(g+w)}</b>.`]};
   }},
 { t:"Prüfungsniveau", s:"Rückwärts rechnen und Skonto",
   learn:`<p>Das ist die Königsklasse. Hier stolpern viele. Mit dem 1-%-Trick schaffen Sie das.</p>
   <div class="box acht"><div class="h">Achtung Falle</div>Sie haben den <b>Bruttopreis</b> und suchen den Nettopreis. Dann ist der Bruttopreis <b>nicht 100 %</b>. Er ist <b>119 %</b>, denn die Steuer ist schon drin.<br>Falsch ist, einfach 19 % abzuziehen.</div>
   <div class="box merke"><div class="h">Brutto zu Netto in 2 Schritten</div><b>Schritt 1.</b> Brutto geteilt durch 119. Das ist 1 %.<br><b>Schritt 2.</b> 1 % mal 100. Das ist netto.</div>
   <div class="box bild"><div class="h">Bild im Kopf</div>Ein Glas mit Wasser und Saft. Netto ist das Wasser, die Steuer ist der Saft. Zusammen ist es brutto, also 119 Teile. Ein Teil ist 1 %.</div>
   <div class="box merke"><div class="h">Skonto</div>Skonto ist ein kleiner Nachlass, wenn Sie schnell bezahlen. Zum Beispiel 2 % bei Zahlung in 10 Tagen. Also Rechnungsbetrag minus Skonto.</div>`,
   ex:{ q:"Eine Rechnung lautet über 2.380 € brutto. Wie hoch ist der Nettobetrag?", steps:["Brutto sind 119 %.","Schritt 1. 1 % ausrechnen. 2.380 € : 119 = 20 €.","Schritt 2. Netto sind 100 %. 20 € × 100 = 2.000 €.","Der Nettobetrag ist <b>2.000 €</b>. Die Steuer ist 380 €."]},
   gen(){
     const k = pick(["bn","bn","ust","sk","rab"]);
     if (k==="bn"){ const n = pick([100,200,300,400,500,600,800,1000,1500,2000,2500,3000]); const b = n*1.19;
       return { q:`Eine Rechnung lautet über ${eur(b)} brutto mit 19 % Umsatzsteuer. Wie hoch ist der Nettobetrag?`, a:n, u:"€",
         steps:["Brutto sind 119 %, nicht 100 %.",`Schritt 1. 1 % ausrechnen. ${eur(b)} : 119 = ${eur(n/100)}.`,`Schritt 2. Netto sind 100 %. ${eur(n/100)} × 100 = ${eur(n)}.`,`Der Nettobetrag ist <b>${eur(n)}</b>.`]}; }
     if (k==="ust"){ const n = pick([100,200,300,500,1000,2000,400]); const b = n*1.19, u = n*0.19;
       return { q:`Ein Kunde zahlt ${eur(b)} brutto. Wie viel Euro Umsatzsteuer (19 %) stecken darin?`, a:u, u:"€",
         steps:["Brutto sind 119 %.",`Schritt 1. 1 % ausrechnen. ${eur(b)} : 119 = ${eur(n/100)}.`,`Schritt 2. Die Steuer sind 19 %. ${eur(n/100)} × 19 = ${eur(u)}.`,`Die Umsatzsteuer ist <b>${eur(u)}</b>.`]}; }
     if (k==="sk"){ const r = pick([500,800,1000,1200,1500,2000,2500,3000,4000]); const p = pick([2,3]); const s = r*p/100;
       return { q:`Eine Rechnung lautet über ${eur(r)}. Wenn Sie in 10 Tagen zahlen, gibt es ${p} % Skonto. Wie viel überweisen Sie?`, a:r-s, u:"€",
         steps:[`Schritt 1. Skonto ausrechnen. 1 % von ${eur(r)} = ${eur(r/100)}. Mal ${p} = ${eur(s)}.`,`Schritt 2. Skonto heißt weniger, also minus. ${eur(r)} minus ${eur(s)} = ${eur(r-s)}.`,`Sie überweisen <b>${eur(r-s)}</b>.`]}; }
     const g = pick([100,200,250,300,400,500,800]); const p = pick([10,20,25]); const neu = g*(100-p)/100;
     return { q:`Nach ${p} % Rabatt kostet ein Stuhl nur noch ${eur(neu)}. Wie viel hat er vorher gekostet?`, a:g, u:"€",
       steps:[`Vorher waren es 100 %. Nach ${p} % Rabatt sind noch ${100-p} % übrig. ${eur(neu)} sind also ${100-p} %.`,`Schritt 1. 1 % ausrechnen. ${eur(neu)} : ${100-p} = ${eur(g/100)}.`,`Schritt 2. Mal 100. ${eur(g/100)} × 100 = ${eur(g)}.`,`Vorher kostete er <b>${eur(g)}</b>.`]};
   }}
 ]};

 { t:"Der umgekehrte Dreisatz", s:"Je mehr, desto weniger",

   ex:{ q:"3 Personen brauchen 8 Stunden für eine Inventur. Wie lange brauchen 6 Personen?", steps:["Mehr Personen, weniger Zeit. Also umgekehrt.","Schritt 1. 3 Personen brauchen 8 Stunden.","Schritt 2. 1 Person allein braucht länger. Also mal 3. 8 × 3 = 24 Stunden.","Schritt 3. 6 Personen sind schneller. Also teilen durch 6. 24 : 6 = 4 Stunden.","6 Personen brauchen <b>4 Stunden</b>."]},

 { t:"Gerade oder umgekehrt?", s:"Den richtigen Weg erkennen",

     if (k==="vorrat"){ const [a,t,b] = pick([[4,15,6],[5,12,10],[6,10,4],[3,20,5],[8,6,12],[10,6,4]]); const tot = a*t;

 { t:"Dreisatz und Prozent", s:"Prüfungsniveau",

function schema(hl){ hl = hl || [];
  let h = '<table class="hk">';
  HK_ROWS.forEach((r,i) => {
    if (i===0) h += '<tr class="grp"><td colspan="3">Einkauf (Bezugskalkulation)</td></tr>';
    if (i===7) h += '<tr class="grp"><td colspan="3">Verkauf (Verkaufskalkulation)</td></tr>';

  });
  return h + '</table>';
}
function ctab(rows){ rows = rows.map(r => r.map(nb)); return '<table class="dt calc">'+rows.map(r=>`<tr class="${r[0]==="="?"sum":""}"><td class="op">${r[0]}</td><td class="l" style="text-align:left">${r[1]}</td><td class="r" style="text-align:right">${r[2]}</td><td class="op">${r[3]||""}</td></tr>`).join("")+'</table>'; }

/* ========== Ansichten ========== */
const NQ = 5, NEED = 4;
const app = $("#app");
function upd(){ $("#xp").textContent = `⭐ ${S.xp} Punkte`; }
function prog(k){ return S.p[k] || {}; }
function unlocked(k,i){ return true; }
function starsHtml(n){ let h=""; for(let i=0;i<3;i++) h += i<n ? "★" : '<span class="off">★</span>'; return `<span class="stars">${h}</span>`; }
function setBack(label, fn){ $("#backt").textContent = label; $("#back").onclick = fn; }

function home(){
  document.documentElement.style.setProperty("--c","#0077A6");
  setBack("Zur Übersicht", () => location.href = "../index.html");
  let h = `<h1>Kaufmännische Grundlagen</h1><p class="lead">Prozentrechnen, Dreisatz und Handelskalkulation von Anfang an. Ganz einfach erklärt, Schritt für Schritt. Alle Levels sind frei. Sie können überall einsteigen und jederzeit springen.</p><div class="tracks">`;
  for (const k of Object.keys(T)){
    const tr = T[k], p = prog(k), done = tr.levels.filter((_,i)=>p[i]>0).length;
    h += `<div class="card track" style="--c:${tr.c}" onclick="location.hash='${k}'"><div class="emo">${tr.emo}</div><h2>${tr.name}</h2><p>${tr.desc}</p>
      <div class="pbar"><i style="width:${Math.round(done/tr.levels.length*100)}%"></i></div><div class="pl"><span>${done} von ${tr.levels.length} Levels</span><span>${done===tr.levels.length?"Geschafft 🏆":"Weiter ➜"}</span></div></div>`;
  }
  h += `</div><div class="card"><b style="color:var(--navy)">So lernen Sie hier</b><ol style="margin:8px 0 0;padding-left:22px">
    <li>Lesen Sie die kurze Erklärung.</li><li>Schauen Sie das Beispiel Schritt für Schritt an.</li><li>Rechnen Sie 5 Aufgaben. Bei einem Fehler bekommen Sie einen Tipp und einen zweiten Versuch.</li><li>Mit 4 richtigen Aufgaben gibt es Level up 🎉 und Sterne.</li><li>Sie können jedes Level wählen. Für Anfänger ist Level 1 der beste Start.</li></ol>
    <p class="small" style="margin-bottom:0">Ein Taschenrechner ist erlaubt. Kommazahlen schreiben Sie mit Komma, zum Beispiel 2,50.</p></div>`;
  app.innerHTML = h; scrollTo(0,0);
}

function track(k){
  const tr = T[k]; document.documentElement.style.setProperty("--c",tr.c);
  setBack("Zurück", () => location.hash = "");
  const p = prog(k);
  let h = `<span class="badge">${tr.emo} ${tr.name}</span><h1>${tr.name}</h1><p class="lead">${tr.desc}</p>
    <div class="tabs"><button class="on" id="tl">Levels</button><button id="ts">Merkzettel</button></div><div id="tv"></div>`;
  app.innerHTML = h;
  const lv = () => { let s = '<div class="path">';
    tr.levels.forEach((L,i) => { const ok = unlocked(k,i), st = p[i]||0;
      s += `<button class="lv ${ok?"":"locked"} ${st?"done":""}" ${ok?`onclick="location.hash='${k}/${i+1}'"`:"disabled"}><span class="n">${ok?(st?"✓":i+1):"🔒"}</span><span class="tx"><b>Level ${i+1}. ${L.t}</b><small>${L.s}</small></span>${st?starsHtml(st):(ok?'<span class="badge">Los</span>':"")}</button>`; });
    $("#tv").innerHTML = s + "</div>"; };
  $("#tl").onclick = () => { $("#tl").classList.add("on"); $("#ts").classList.remove("on"); lv(); };
  $("#ts").onclick = () => { $("#ts").classList.add("on"); $("#tl").classList.remove("on"); $("#tv").innerHTML = `<div class="card sheet">${tr.sheet}</div>`; };
  lv(); scrollTo(0,0);
}

function lesson(k,i){
  const tr = T[k], L = tr.levels[i]; document.documentElement.style.setProperty("--c",tr.c);
  if (!unlocked(k,i)) { location.hash = k; return; }
  setBack("Alle Levels", () => location.hash = k);
  app.innerHTML = `<span class="badge">${tr.name} · Level ${i+1} von ${tr.levels.length}</span><h1>${L.t}</h1>
   <div class="card learn">${L.learn}</div>
   <div class="card"><b style="color:var(--navy);font-size:18px">Beispiel Schritt für Schritt</b><p class="q" style="margin-top:8px">${L.ex.q}</p><ol class="steps" id="exs"></ol>
   <div class="row"><button class="btn" id="nx">Ersten Schritt zeigen</button></div></div>`;
  let sI = 0; const nx = $("#nx");
  nx.onclick = () => {
    if (sI < L.ex.steps.length){ $("#exs").insertAdjacentHTML("beforeend", `<li>${L.ex.steps[sI]}</li>`); sI++;
      nx.textContent = sI < L.ex.steps.length ? "Nächster Schritt" : "Verstanden. Jetzt selbst üben ➜"; }
    else practice(k,i);
  };
  scrollTo(0,0);
}

function practice(k,i){
  const tr = T[k], L = tr.levels[i];
  setBack("Zur Erklärung", () => lesson(k,i));
  const tasks = []; const seen = new Set();
  for (let t=0; t<40 && tasks.length<NQ; t++){ const x = L.gen(); if (!seen.has(x.q)){ seen.add(x.q); tasks.push(x); } }
  while (tasks.length < NQ) tasks.push(L.gen());
  const res = []; let n = 0;
  const show = () => {
    const x = tasks[n]; let tries = 0, sel = null;
    let dots = '<div class="dots">'; for (let j=0;j<NQ;j++) dots += `<i class="${j<n?(res[j]?"ok":"no"):(j===n?"cur":"")}"></i>`; dots += "</div>";
    const inp = x.choices ? `<div class="ch" id="ch">${x.choices.map((c,ci)=>`<button data-i="${ci}">${c}</button>`).join("")}</div>`
      : `<div class="ans"><input id="in" inputmode="decimal" autocomplete="off" placeholder="Ihre Lösung"><span class="u">${x.u||""}</span></div>`;
    app.innerHTML = `<span class="badge">${tr.name} · Level ${i+1}</span><h1 style="font-size:22px">Aufgabe ${n+1} von ${NQ}</h1>${dots}
      <div class="card"><div class="q">${x.q}</div>${inp}<div id="fb"></div>
      <div class="row"><button class="btn" id="ok">Prüfen</button><button class="btn ghost" id="hl">Tipp</button></div></div>`;
    const ok = $("#ok"), fb = $("#fb");
    if (x.choices){ $("#ch").onclick = e => { const b = e.target.closest("button"); if (!b || b.disabled) return; document.querySelectorAll("#ch button").forEach(z=>z.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.i; }; }
    else { const el = $("#in"); el.focus({preventScroll:true}); el.onkeydown = e => { if (e.key==="Enter") ok.click(); }; }
    const stepsHtml = `<ol>${x.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`;
    $("#hl").onclick = () => { fb.innerHTML = `<div class="fb hint"><b class="t">💡 Tipp</b>${x.steps[0]}</div>`; };
    const finish = good => {
      res[n] = good; if (good) { S.xp += tries===0 ? 10 : 5; save(); upd(); }
      if (x.choices) document.querySelectorAll("#ch button").forEach(b => { b.disabled = true; if (+b.dataset.i===x.a) b.classList.add("good"); else if (+b.dataset.i===sel) b.classList.add("wrong"); });
      else $("#in").disabled = true;
      $("#hl").remove();
      ok.textContent = n < NQ-1 ? "Nächste Aufgabe ➜" : "Ergebnis ansehen ➜";
      ok.onclick = () => { n++; n < NQ ? show() : result(k,i,res); };
      ok.focus();
    };
    ok.onclick = () => {
      let good;
      if (x.choices){ if (sel===null){ fb.innerHTML = `<div class="fb hint"><b class="t">Bitte wählen</b>Klicken Sie auf eine Antwort.</div>`; return; } good = sel===x.a; }
      else { const v = parseNum($("#in").value); if (isNaN(v)){ fb.innerHTML = `<div class="fb hint"><b class="t">Bitte eine Zahl eingeben</b>Zum Beispiel 25 oder 2,50.</div>`; return; } good = Math.abs(v - x.a) < (x.tol || 0.011); }
      if (good){ fb.innerHTML = `<div class="fb ok"><b class="t">✓ Richtig${tries?" im zweiten Versuch":""}. Super!</b>So geht der Weg.${stepsHtml}</div>`; finish(true); return; }
      tries++;
      if (tries===1 && (!x.choices || x.choices.length>2)){
        fb.innerHTML = `<div class="fb hint"><b class="t">Noch nicht ganz. Versuchen Sie es noch einmal.</b>💡 ${x.steps[0]}</div>`;
        if (x.choices){ const b = document.querySelector(`#ch button[data-i="${sel}"]`); if (b){ b.classList.add("wrong"); b.disabled = true; } sel = null; }
        else { const el = $("#in"); el.select(); }
        return;
      }
      const rt = x.choices ? x.choices[x.a] : `${z(x.a)} ${x.u||""}`;
      fb.innerHTML = `<div class="fb no"><b class="t">Leider nicht richtig</b>Die richtige Lösung ist <b>${rt}</b>. So kommen Sie dahin.${stepsHtml}</div>`;
      finish(false);
    };
  };
  show();
}

function result(k,i,res){
  const tr = T[k], good = res.filter(Boolean).length, pass = good >= NEED, st = good===NQ ? 3 : good>=NEED ? 2 : 0;
  const p = S.p[k] = S.p[k] || {}; const first = pass && !(p[i]>0);
  if (pass){ p[i] = Math.max(p[i]||0, st); if (first) S.xp += 20; save(); upd(); }
  const last = i === tr.levels.length-1;
  setBack("Alle Levels", () => location.hash = k);
  app.innerHTML = `<div class="card res">${pass?`<div class="lvup">LEVEL UP</div><div class="big" style="margin-top:14px">${last?"🏆":"🎉"}</div><h2>${last?"Alle Levels geschafft!":"Level "+(i+1)+" geschafft!"}</h2>${starsHtml(st)}`
    : `<div class="big">💪</div><h2>Fast geschafft!</h2>`}
    <p>Sie haben <b>${good} von ${NQ}</b> Aufgaben richtig.${pass?(first?" Dafür gibt es 20 Extrapunkte.":""):` Für Level up und Sterne brauchen Sie ${NEED} richtige. Lesen Sie die Erklärung noch einmal in Ruhe. Die Zahlen sind beim nächsten Versuch neu.`}</p>
    <div class="row" style="justify-content:center">
      ${!last ? `<button class="btn ${pass?"":"ghost"}" onclick="location.hash='${k}/${i+2}'">Weiter zu Level ${i+2} ➜</button>` : ""}
      ${pass && last ? `<button class="btn" onclick="location.hash='${k==="prozent"?"dreisatz":"prozent"}'">${k==="prozent"?"Zum Dreisatz":"Zum Prozentrechnen"} ➜</button>` : ""}
      ${!pass ? `<button class="btn" id="again">Noch einmal üben</button><button class="btn ghost" onclick="lesson('${k}',${i})">Erklärung lesen</button>` : `<button class="btn ghost" id="again">Noch einmal üben</button>`}
    </div></div>`;
  const ag = $("#again"); if (ag) ag.onclick = () => practice(k,i);
  if (pass) confetti();
  scrollTo(0,0);
}

function confetti(){
  const c = document.createElement("div"); c.className = "conf"; const cols = ["#0077A6","#e0a100","#1d8a6b","#7048b0","#ff7a59","#003366"];
  for (let j=0;j<70;j++){ const i = document.createElement("i"); i.style.left = Math.random()*100+"vw"; i.style.background = pick(cols);
    i.style.animationDuration = (1.6+Math.random()*1.8)+"s"; i.style.animationDelay = Math.random()*.6+"s"; i.style.transform = `rotate(${ri(0,180)}deg)`; c.appendChild(i); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 4200);
}

function route(){
  const h = location.hash.replace(/^#/,""); const [k, l] = h.split("/");
  if (T[k] && l && +l>=1 && +l<=T[k].levels.length) lesson(k, +l-1);
  else if (T[k]) track(k);
  else home();
}
window.addEventListener("hashchange", route);
upd(); route();
</script>
